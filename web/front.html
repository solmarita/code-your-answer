<div class="cya-root cya-front">
    {{Front}}
    <br>
    <br>
    <div id="editor"></div>
</div>


<script>

    function tryInitialize() {
        // Guard clause: do nothing if we are on the back side
        if (document.querySelector(".cya-back")) return;
        
        // Get card language from the language field
        const langFromAnki = "{{Language}}".trim().toLowerCase();

        if (window.initCyaEditor) {
            // Pass the variable to the function
            window.initCyaEditor(langFromAnki);
        } else {
            setTimeout(tryInitialize, 50);
        }
    }
    tryInitialize();
</script>
